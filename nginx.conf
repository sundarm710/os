server {
    listen 80;
    server_name app.srv1536472.hstgr.cloud;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the service worker, its loader, workbox runtime, manifest,
    # or index.html — these are the update-discovery surface. Must come BEFORE
    # the immutable-assets rule (first matching regex location wins in nginx).
    location = /sw.js              { expires -1; add_header Cache-Control "no-cache"; }
    location = /registerSW.js      { expires -1; add_header Cache-Control "no-cache"; }
    location ~* ^/workbox-.*\.js$  { expires -1; add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { expires -1; add_header Cache-Control "no-cache"; }
    location = /index.html         { expires -1; add_header Cache-Control "no-cache"; }

    location ~* \.(js|css|png|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(webmanifest|json)$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }
}
